<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Caspar Floating Score Bug</title>

    <!-- Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Flag icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css"/>

    <style>
        :root {
            --bg-transparent: transparent;
            --row-bg: rgba(255, 255, 255, 0.90);  /* Option 1: bright white strips */
            --text-dark: #111320;
            --muted-text: #555a70;
            --accent-game: #ffc107;
            --accent-outline: rgba(0, 0, 0, 0.1);
            --set-bg: rgba(248, 249, 252, 0.8);
            --set-border: rgba(0, 0, 0, 0.12);
            --set-win-bg: rgba(61, 220, 132, 0.25);
            --set-win-border: rgba(61, 220, 132, 0.9);
            --drop-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;  /* For CasparCG / vMix alpha */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body.debug-mode {
            background: #000000;
        }

        #canvas {
            position: absolute;
            width: 1920px;
            height: 1080px;
            top: 0;
            left: 0;
            background: transparent;
            pointer-events: none; /* So CasparCG/vMix don’t get weird clicks */
        }

        /* Safe area in top-left: 60px inset, as per your earlier bug */
        #safe-container {
            position: absolute;
            top: 60px;
            left: 60px;
            background: transparent;
        }

        /* Score content box. Show/hide + slide animation lives on #bug-shell
           (static/css/caspar_bug.css) so the logo and score panel move as one unit. */
        #bug {
            display: inline-flex;
            flex-direction: column;
            gap: 2px;
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            overflow: visible;
            width: max-content;
            min-width: 0;
        }

        .player-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            column-gap: 12px;
            padding: 4px 10px;
            min-width: 0;
            width: max-content;
            background: var(--row-bg);
        }

        .player-row:first-child {
            border-radius: 10px 10px 0 0;
        }

        .player-row:last-child {
            border-radius: 0 0 10px 10px;
        }

        .player-row + .player-row {
            border-top: 1px solid rgba(0, 0, 0, 0.08);
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 130px;
        }

        .flag-icon {
            font-size: 1.25rem;
        }

        .surname {
            display: inline-block;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text-dark);
            text-transform: uppercase;
            max-width: 323px;
            white-space: nowrap;
            overflow: visible;
            transform-origin: left center;
        }

        .sets {
            display: block;
            gap: 4px;
            align-items: center;
            width: 100%;
        }

        /* Each player's sets row: render items right-to-left so set1 appears at the right
           and new sets are added to the left. Use flex row-reverse and small gap (<=5px). */
        .sets-row {
            display: flex;
            flex-direction: row-reverse;
            gap: 4px; /* <=5px as requested */
            align-items: center;
            justify-content: flex-end; /* anchor boxes to the right */
        }

        .set-cell {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            border: 1px solid var(--set-border);
            background: var(--set-bg);
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-dark);
            box-sizing: border-box;
        }

        .set-cell.win {
            background: var(--set-win-bg);
            border-color: var(--set-win-border);
        }

        .set-cell.loss {
            opacity: 0.8;
        }

        .right-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding-left: 8px;
            min-width: 56px;
        }

        .game-wrap {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
        }

        .game-box {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            border: 1px solid var(--accent-outline);
            background: #111827;
            color: var(--accent-game);
            font-weight: 800;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            letter-spacing: 0.02em;
            box-sizing: border-box;
        }

        /* Place serve-dot to the right of the score box */
        .serve-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: transparent;
            border: 2px solid rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        .serve-dot.active {
            background: var(--accent-game);
            box-shadow: 0 0 0 6px rgba(255, 193, 7, 0.18);
            border-color: rgba(255, 193, 7, 0.9);
        }

        /* Grid that aligns each player's name, their sets, and their game box on the same row */
        .bug-grid {
            display: grid;
            grid-template-columns: auto 1fr auto;
            grid-auto-rows: 30px;
            gap: 4px 8px;
            align-items: center;
            min-width: 0;
            width: max-content;
            padding: 6px 10px;
            background: transparent;
        }

        .bug-grid .player-left {
            padding: 0;
            min-width: 130px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bug-grid .right-cell {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .sets-row {
            width: max-content;
        }

        /* Animations for score change / serve change */
        .pulse {
            animation: pulseAnim 0.25s ease-out;
        }

        @keyframes pulseAnim {
            0%   { transform: scale(1);   }
            50%  { transform: scale(1.2); }
            100% { transform: scale(1);   }
        }

        .flash {
            animation: flashAnim 0.35s ease-out;
        }

        @keyframes flashAnim {
            0%   { background-color: rgba(255, 243, 205, 1); }
            100% { background-color: var(--row-bg); }
        }

        .serve-pulse {
            animation: servePulse 0.25s ease-out;
        }

        @keyframes servePulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* Debug helper text when no match_data in debug mode */
        #debug-info {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #ccc;
            display: none;
        }

        body.debug-mode #debug-info {
            display: block;
        }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/caspar_bug.css') }}">
</head>

<body class="{% if debug_mode %}debug-mode{% endif %}" data-debug-mode="{{ '1' if debug_mode else '0' }}" data-bug-court="{{ bug_court or '' }}">
<div id="canvas">
    <div id="safe-container">
        <div id="bug-shell" class="hidden">
            {% if bug_logo_url %}
            <div id="bug-logo-wrap">
                <img id="bug-logo" src="{{ bug_logo_url }}" alt="Bug logo">
            </div>
            {% endif %}

            <div id="bug-and-debug">
                <div id="bug">
                    <!-- rows injected via JS -->
                </div>

                <div id="debug-info">
                    {% if debug_mode %}
                    Debug mode is ON.
                    {% if not match_data %}
                    No initial match_data passed – waiting for WebSocket updates.
                    {% else %}
                    Showing initial match: {{ match_data.matchid }} ({{ match_data.player1 }} vs {{ match_data.player2 }})
                    {% endif %}
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

<script id="bug-initial-data" type="application/json">{{ (match_data if match_data is not none else none)|tojson }}</script>

<script>
    // --- Template variables from Flask ---
    const debugMode = document.body.dataset.debugMode === '1';
    const bugCourt = (document.body.dataset.bugCourt || '').trim();
    let initialMatchData = null;
    const initialDataNode = document.getElementById('bug-initial-data');
    if (initialDataNode && initialDataNode.textContent) {
        try {
            initialMatchData = JSON.parse(initialDataNode.textContent);
        } catch (e) {
            console.error('Failed to parse initial bug JSON payload.', e);
            initialMatchData = null;
        }
    }

    // We track current match ID and data
    let matchData = initialMatchData;
    let currentMatchId = matchData ? matchData.matchid : null;
    let forceHidden = false;

    const bugEl = document.getElementById('bug');
    const bugShellEl = document.getElementById('bug-shell');
    let hideTimeoutId = null;
    const HIDE_TRANSITION_MS = 420; // keep in sync with #bug-shell transition duration

    // --- ISO 3 -> flag-icon code ---
    const iso3ToIso2 = {
        'GBR':'gb','ESP':'es','SRB':'rs','FRA':'fr','GER':'de','USA':'us','CAN':'ca','AUS':'au',
        'NED':'nl','SUI':'ch','ITA':'it','CRO':'hr','POL':'pl','SWE':'se','NOR':'no','ARG':'ar',
        'BRA':'br','ROU':'ro','DEN':'dk','POR':'pt','BEL':'be','FIN':'fi','CHN':'cn','JPN':'jp',
        'HUN':'hu','IRL':'ie','SCO':'gb-sct','WAL':'gb-wls','RSA':'za','CZE':'cz','AUT':'at','IND':'in'
    };
    function toISO2(code) {
        if (!code) return '';
        const upper = code.toUpperCase();
        return iso3ToIso2[upper] || upper.slice(0,2).toLowerCase();
    }

    function toInt(val) {
        const n = parseInt(val, 10);
        return Number.isNaN(n) ? 0 : n;
    }

    // Shrink (never truncate) a surname horizontally so it always fits within
    // SURNAME_MAX_WIDTH, instead of clipping it with an ellipsis.
    const SURNAME_MAX_WIDTH = 323;
    function fitSurnameText(el) {
        if (!el) return;
        el.style.transform = 'none';
        const naturalWidth = el.scrollWidth;
        el.style.transform = naturalWidth > SURNAME_MAX_WIDTH
            ? `scaleX(${SURNAME_MAX_WIDTH / naturalWidth})`
            : '';
    }

    function fitAllSurnames() {
        document.querySelectorAll('#bug .surname').forEach(fitSurnameText);
    }

        // --- Build helpers for the bug layout ---
        function buildPlayerInfoHTML(match, isP1, isServing) {
                const prefix = isP1 ? 'p1' : 'p2';
                const surnameKey = prefix === 'p1' ? 'player1_surname' : 'player2_surname';
                const fullNameKey = prefix === 'p1' ? 'player1' : 'player2';
                const countryKey = prefix === 'p1' ? 'player1_country' : 'player2_country';

                const surname = (match[surnameKey] || '').trim() || (match[fullNameKey] || '').trim();
                const countryISO2 = toISO2(match[countryKey] || '');
                return `
                    <div class="player-left" data-row="${prefix}">
                        <span class="serve-ball ${isServing ? 'active' : ''}" data-key="serve_${prefix}">
                            <svg viewBox="0 0 100 100" class="serve-ball-icon" aria-hidden="true">
                                <defs><clipPath id="ballClip-${prefix}"><circle cx="50" cy="50" r="48"/></clipPath></defs>
                                <circle cx="50" cy="50" r="48" class="ball-fill"/>
                                <g clip-path="url(#ballClip-${prefix})">
                                    <path class="seam" d="M4 64 Q 34 54 42 4"/>
                                    <path class="seam" d="M96 36 Q 66 46 58 96"/>
                                </g>
                            </svg>
                        </span>
                        <span class="flag-icon flag-icon-${countryISO2}"></span>
                        <span class="surname" data-key="surname_${prefix}">${surname}</span>
                    </div>`;
        }

        function buildPlayerLeftHTML(match, isP1, isServing) {
                // For convenience; same as buildPlayerInfoHTML but named for clarity
                return buildPlayerInfoHTML(match, isP1, isServing);
        }

        // Build a single player's sets-row HTML
        function buildPlayerSetsRowHTML(match, isP1) {
                const prefix = isP1 ? 'p1' : 'p2';
                const setsPlayed = toInt(match.sets_played_count) || 0;
                const maxSets = Math.max(setsPlayed, 1);
                let cells = '';

                for (let i = 1; i <= maxSets; i++) {
                        const playerSetKey = `set${i}_${prefix}`;
                        const opponentSetKey = `set${i}_${isP1 ? 'p2' : 'p1'}`;
                        const tbKey = `set${i}_tb`;

                        if (match[playerSetKey] == null && match[opponentSetKey] == null) continue;

                        const playerSet = toInt(match[playerSetKey]);
                        const opponentSet = toInt(match[opponentSetKey]);
                        const tb = match[tbKey];

                        let disp = playerSet.toString();
                        if (tb && tb !== "0") {
                                if (playerSet === opponentSet && tb) {
                                        disp = `${disp}(${tb})`;
                                }
                        }

                        let cls = 'set-cell';
                        if (playerSet !== 0 || opponentSet !== 0) {
                                if (playerSet > opponentSet) cls += ' win'; else if (playerSet < opponentSet) cls += ' loss';
                        }

                        cells += `<span class="${cls}" data-key="set_${prefix}_${i}">${disp}</span>`;
                }

                if (!cells) cells = `<span class="set-cell" data-key="set_${prefix}_1">–</span>`;
                return `<div class="sets-row">${cells}</div>`;
        }

        // Build a single player's game score cell (serve indicator now lives next to the name)
        function buildPlayerGameScoreHTML(match, isP1) {
                const prefix = isP1 ? 'p1' : 'p2';
                const gameKey = isP1 ? 'game1' : 'game2';
                const gameScore = (match[gameKey] || '').toString();
                return `
                    <div class="right-cell">
                        <div class="game-box" data-key="game_${prefix}">${gameScore}</div>
                    </div>`;
        }

    // Slide/fade the whole shell (logo + score panel) out, then clear the
    // score content only once the exit animation has actually finished so
    // the bug doesn't snap away mid-transition.
    function hideBug() {
        bugShellEl.classList.remove('visible');
        bugShellEl.classList.add('hidden');
        clearTimeout(hideTimeoutId);
        hideTimeoutId = setTimeout(() => { bugEl.innerHTML = ""; }, HIDE_TRANSITION_MS);
    }

    function renderBug(match) {
        if (!match) {
            hideBug();
            return;
        }

        const winnerName = (match.winner_name || '').trim();

        // If match is finished and not in debug mode, hide the bug
        if (winnerName && !debugMode) {
            hideBug();
            return;
        }

        // Cancel any pending "clear content" from a previous hide so new data isn't wiped out
        clearTimeout(hideTimeoutId);

        // Determine serving flags (player2serve: '1' -> p1, '2' -> p2)
        const p2serve = String(match.player2serve || '');
        const p1Serving = (p2serve === '1' || p2serve === '0');
        const p2Serving = (p2serve === '2');

        bugEl.innerHTML = `
            <div class="bug-grid">
                ${buildPlayerLeftHTML(match, true, p1Serving)}
                <div class="sets">${buildPlayerSetsRowHTML(match, true)}</div>
                ${buildPlayerGameScoreHTML(match, true)}

                ${buildPlayerLeftHTML(match, false, p2Serving)}
                <div class="sets">${buildPlayerSetsRowHTML(match, false)}</div>
                ${buildPlayerGameScoreHTML(match, false)}
            </div>`;

        fitAllSurnames();

        if (forceHidden) {
            hideBug();
            return;
        }

        bugShellEl.classList.remove('hidden');
        bugShellEl.classList.add('visible');
    }

    // Playout control hooks for CasparCG and vMix
    function playIn() {
        forceHidden = false;
        if (matchData) renderBug(matchData);
    }

    function playOut() {
        forceHidden = true;
        hideBug();
    }

    window.play = playIn;
    window.stop = playOut;
    window.playIn = playIn;
    window.playOut = playOut;

    function handleExternalCommand(cmd) {
        const c = (cmd || '').toString().toLowerCase();
        if (!c) return;
        if (c === 'play' || c === 'playin' || c === 'in' || c === 'show') playIn();
        if (c === 'stop' || c === 'playout' || c === 'out' || c === 'hide') playOut();
    }

    window.addEventListener('message', (event) => {
        if (!event) return;
        const payload = event.data;
        if (typeof payload === 'string') {
            handleExternalCommand(payload);
        } else if (payload && typeof payload === 'object') {
            handleExternalCommand(payload.command || payload.cmd);
        }
    });

    // --- Animations on changes ---
    function animateChange(key) {
        const el = document.querySelector(`[data-key="${key}"]`);
        if (!el) return;
        el.classList.add('pulse');
        setTimeout(() => el.classList.remove('pulse'), 260);
    }

    function animateServe(key) {
        const el = document.querySelector(`[data-key="${key}"]`);
        if (!el) return;
        el.classList.add('serve-pulse');
        setTimeout(() => el.classList.remove('serve-pulse'), 260);
    }

    function updateBug(newMatch) {
        if (!newMatch) return;

        // First-time render
        if (!matchData) {
            matchData = newMatch;
            currentMatchId = newMatch.matchid;
            renderBug(newMatch);
            return;
        }

        // If match ID changed, re-render from scratch
        if (newMatch.matchid !== matchData.matchid) {
            matchData = newMatch;
            currentMatchId = newMatch.matchid;
            renderBug(newMatch);
            return;
        }

        // Compare changes
        const old = matchData;

        // Check game scores
        if (newMatch.game1 !== old.game1) animateChange('game_p1');
        if (newMatch.game2 !== old.game2) animateChange('game_p2');

        const newSetsPlayed = toInt(newMatch.sets_played_count) || 0;
        for (let i = 1; i <= Math.max(newSetsPlayed, 1); i++) {
            if (newMatch[`set${i}_p1`] !== old[`set${i}_p1`]) animateChange(`set_p1_${i}`);
            if (newMatch[`set${i}_p2`] !== old[`set${i}_p2`]) animateChange(`set_p2_${i}`);
        }

        // Serve side changed?
        if (toInt(newMatch.player2serve) !== toInt(old.player2serve)) {
            animateServe('serve_p1');
            animateServe('serve_p2');
        }

        matchData = newMatch;
        renderBug(newMatch);
    }

    // Initial render if we have initial match_data from Flask
    if (matchData) {
        renderBug(matchData);
    } else if (debugMode) {
        // In debug mode, if no matchData yet, we just wait for WS.
        console.log("Debug mode: waiting for WebSocket to deliver match data...");
    }

    // --- Socket.IO live updates ---
    // Always connect directly in this preview file (each preview opens its own socket).
    const socket = io();

    socket.on("connect", () => {
        console.log("Bug overlay connected to Socket.IO.");
        // Subscribe to just this overlay's match/court so the server only sends
        // our own updates instead of broadcasting the full match list here.
        if (currentMatchId || bugCourt) {
            socket.emit("subscribe", {
                matchid: currentMatchId || "",
                court: bugCourt || ((matchData && matchData.court) || "")
            });
        } else {
            // No match or court resolved yet: fall back to full updates so we can latch on.
            socket.emit("subscribe_all");
        }
    });

    socket.on("disconnect", () => {
        console.log("Bug overlay disconnected from Socket.IO.");
        // We do NOT hide the bug on disconnect; last known data remains.
    });

    // Targeted single-match updates (normal path once subscribed)
    socket.on("match_update", (data) => {
        if (!data || !data.match) return;
        const m = data.match;

        // Court-room events can carry other matches on this court (e.g. an old
        // completed match getting a correction) - only switch to a different
        // match if it is actually live.
        if (currentMatchId && String(m.matchid) !== String(currentMatchId)) {
            const st = (m.matchstatus || '').toUpperCase();
            const isLive = st.includes('IN PROGRESS') || st.includes('WARMUP') || st.includes('TEST');
            if (bugCourt) {
                const matchCourt = (String(m.court || '').match(/\d+/) || [null])[0];
                if (matchCourt !== bugCourt) return;
            }
            if (!isLive) return;
        }

        updateBug(m);
    });

    // Full-list fallback (only received while subscribed via subscribe_all)
    socket.on("live_updates", (data) => {
        if (!data || !data.live_matches) return;

        const matches = data.live_matches;

        let updated = null;

        if (currentMatchId) {
            updated = matches.find(m => String(m.matchid) === String(currentMatchId));
        }

        // If no currentMatchId (or match disappeared), attempt to pick one
        if (!updated && !currentMatchId) {
            // First preference: any live match
            const live = matches.filter(m => {
                const st = (m.matchstatus || '').toUpperCase();
                return st.includes('IN PROGRESS') || st.includes('TEST');
            });
            if (live.length === 1) {
                updated = live[0];
                currentMatchId = updated.matchid;
                // Now that we have a match, get targeted updates for it too
                socket.emit("subscribe", {
                    matchid: currentMatchId,
                    court: updated.court || ""
                });
            }
        }

        if (!updated) return;

        updateBug(updated);
    });
</script>
</body>
</html>
