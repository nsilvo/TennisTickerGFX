version: "3.8"
# File: docker-compose.yml
# Description: Orchestrates app and Postgres services for tennis XML scraper.
# Author: Nathan Silveston
# Contact: nathan@nkpa.co.uk | +44 7515 018048
# Copyright (c) 2025 Nathan Silveston. All rights reserved.
services:
  app:
    build: .
    container_name: tennisxml-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - TZ=UTC
      - DATABASE_URL=postgresql://tennisxml:tennisxml@postgres:5432/tennisxml
    restart: unless-stopped
    volumes:
      - ./:/app:ro
    depends_on:
      - postgres
    # If you have a database file, mount a writable volume for it
    # - ./data:/app/data

  # Optional: Reverse proxy with Nginx
  # proxy:
  #   image: nginx:stable
  #   depends_on:
  #     - app
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
  #   restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: tennisxml-postgres
    environment:
      - POSTGRES_DB=tennisxml
      - POSTGRES_USER=tennisxml
      - POSTGRES_PASSWORD=tennisxml
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
