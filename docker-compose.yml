version: "3.8"
services:
  app:
    build: .
    container_name: tennisxml-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - TZ=UTC
    restart: unless-stopped
    volumes:
      - ./:/app:ro
    # If you have a database file, mount a writable volume for it
    # - ./data:/app/data

  # Optional: Reverse proxy with Nginx
  # proxy:
  #   image: nginx:stable
  #   depends_on:
  #     - app
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
  #   restart: unless-stopped
