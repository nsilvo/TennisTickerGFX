# File: docker-compose.yml
# Description: Orchestrates app and Postgres services for tennis XML scraper.
# Author: Nathan Silveston
# Contact: nathan@nkpa.co.uk | +44 7515 018048
# Copyright (c) 2025 Nathan Silveston. All rights reserved.
services:
  app:
    build: .
    container_name: tennisxml-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - TZ=UTC
      # Defaults to the bundled postgres service below; override for external DB (RDS etc.)
      - DATABASE_URL=${DATABASE_URL:-postgresql://tennisxml:tennisxml@postgres:5432/tennisxml}
      # Admin page login (page is disabled when unset)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Keeps admin sessions valid across restarts
      - SECRET_KEY=${SECRET_KEY:-}
      # Set to true when serving over HTTPS (e.g. behind the nginx proxy)
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      # Defaults for the TennisTicker feed; the /admin page overrides these
      - TT_USERID=${TT_USERID:-}
      - TT_CONTRACT=${TT_CONTRACT:-}
      # Padel API (padelapi.org) for pro player bios; a token saved on /players overrides this
      - PADEL_API_TOKEN=${PADEL_API_TOKEN:-}
      # Requests per minute allowed by your Padel API plan (free 10, Plus/Pro 60, Business 500)
      - PADEL_API_RATE_PER_MIN=${PADEL_API_RATE_PER_MIN:-10}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./:/app:ro
    # If you have a database file, mount a writable volume for it
    # - ./data:/app/data

  # Optional: Reverse proxy with Nginx
  # proxy:
  #   image: nginx:stable
  #   depends_on:
  #     - app
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
  #   restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: tennisxml-postgres
    environment:
      - POSTGRES_DB=tennisxml
      - POSTGRES_USER=tennisxml
      - POSTGRES_PASSWORD=tennisxml
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennisxml -d tennisxml"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
